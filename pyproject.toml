[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acadsearch"
version = "1.0.0"
description = "Unified Academic Search Database SDK, CLI, REST API, and Model Context Protocol (MCP) Server for AI Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.scripts]
acadsearch = "acadsearch.cli:main"
acadsearch-mcp = "acadsearch.mcp_server:run_stdio_mcp_server"

[tool.setuptools.packages.find]
include = ["acadsearch*"]
